<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exhibitor Ads</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    #page-image {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <img id="page-image" alt="Exhibitor advertising information">

  <script>
    const image = document.getElementById("page-image");

    const isMobile =
      window.innerWidth <= 768 ||
      screen.width <= 768 ||
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    if (isMobile) {
      image.src = "./mobile.png?v=10";
    } else {
      image.src = "./desktop.png?v=10";
    }
  </script>

</body>
</html>
