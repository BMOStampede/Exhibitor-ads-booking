<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BMO Centre Exhibitor Advertising</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            overflow-x: hidden;
        }

        .desktop-image,
        .mobile-image {
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
        }

        /* DESKTOP */
        .desktop-image {
            display: block;
        }

        .mobile-image {
            display: none;
        }

        /* MOBILE */
        @media screen and (max-width: 900px) {
            .desktop-image {
                display: none;
            }

            .mobile-image {
                display: block;
            }
        }
    </style>
</head>

<body>

    <!-- DESKTOP -->
    <img
        class="desktop-image"
        src="./desktop final version.png"
        alt="BMO Centre Exhibitor Advertising">


    <!-- MOBILE -->
    <img
        class="mobile-image"
        src="./mobile final version (1).png"
        alt="BMO Centre Exhibitor Advertising">

</body>

</html>
