<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exhibitor Ads</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ffffff;
    }

    picture,
    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <picture>
    <source
      media="(max-width: 767px)"
      srcset="mobile final discount.png"
    >

    <img
      src="desktop final discount (1).png"
      alt="Exhibitor advertising information"
    >
  </picture>
</body>
</html>
