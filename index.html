<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exhibitor Ads</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: white;
    }

    .desktop-image,
    .mobile-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .mobile-image {
      display: none;
    }

    @media screen and (max-width: 767px) {
      .desktop-image {
        display: none;
      }

      .mobile-image {
        display: block;
      }
    }
  </style>
</head>

<body>
  <img
    class="desktop-image"
    src="./desktop.png"
    alt="Exhibitor advertising information"
  >

  <img
    class="mobile-image"
    src="./mobile.png"
    alt="Exhibitor advertising information"
  >
</body>
</html>
